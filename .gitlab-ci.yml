# Serverless event pipeline: lint -> test -> checkov -> plan -> apply (manual, main only)
#
# AWS credentials (see README "CI/CD variables"):
#   Preferred: AWS_ROLE_ARN set -> GitLab OIDC token is exchanged for that role by
#              the Terraform AWS provider (AssumeRoleWithWebIdentity). No static keys.
#   Fallback:  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as masked CI variables.

stages:
  - lint
  - test
  - checkov
  - plan
  - apply

variables:
  TERRAFORM_IMAGE: "hashicorp/terraform:1.10.5"
  PYTHON_IMAGE: "python:3.12-slim"
  CHECKOV_IMAGE: "bridgecrew/checkov:3"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "${CI_PROJECT_DIR}/.terraform-plugin-cache"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.pip-cache"
  AWS_REGION: "us-east-1"
  TF_VAR_aws_region: "${AWS_REGION}"
  TF_VAR_environment: "dev"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.terraform_base:
  image:
    name: $TERRAFORM_IMAGE
    entrypoint: [""]
  cache:
    key: terraform-providers
    paths:
      - .terraform-plugin-cache/
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - cd "$TF_ROOT"

.aws_auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - |
      if [ -n "${AWS_ROLE_ARN:-}" ]; then
        token_file="$(mktemp)"
        printf '%s' "$GITLAB_OIDC_TOKEN" > "$token_file"
        export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file"
        export AWS_ROLE_SESSION_NAME="gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
        echo "AWS auth: OIDC web identity -> ${AWS_ROLE_ARN}"
      elif [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "AWS auth: static access keys from masked CI variables"
      else
        echo "No AWS credentials: set AWS_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY" >&2
        exit 1
      fi
    - |
      if [ -z "${TF_STATE_BUCKET:-}" ]; then
        echo "TF_STATE_BUCKET is not set" >&2
        exit 1
      fi
    - cd "$TF_ROOT"
    - >
      terraform init
      -backend-config="bucket=${TF_STATE_BUCKET}"
      -backend-config="key=${TF_STATE_KEY:-serverless-event-pipeline/${TF_VAR_environment}.tfstate}"
      -backend-config="region=${AWS_REGION}"
      -backend-config="encrypt=true"
      -backend-config="use_lockfile=true"

# ------------------------------------------------------------------ lint ----

terraform_lint:
  extends: .terraform_base
  stage: lint
  script:
    - terraform fmt -check -recursive -diff
    - terraform init -backend=false
    - terraform validate

python_lint:
  stage: lint
  image: $PYTHON_IMAGE
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -r requirements-dev.txt
    - ruff check src tests
    - ruff format --check src tests

# ------------------------------------------------------------------ test ----

unit_tests:
  stage: test
  image: $PYTHON_IMAGE
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -r requirements-dev.txt
    - pytest --junitxml=junit.xml --cov=src --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=90
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --------------------------------------------------------------- checkov ----
# Without a Prisma Cloud API key Checkov has no severity data, so the job fails
# on ANY failed check (stricter than HIGH/CRITICAL). With PRISMA_API_KEY set it
# uses real severities and hard-fails only on HIGH and CRITICAL.

checkov:
  stage: checkov
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  script:
    - mkdir -p checkov-report
    - |
      if [ -n "${PRISMA_API_KEY:-}" ]; then
        checkov --config-file .checkov.yml --bc-api-key "$PRISMA_API_KEY" \
          --soft-fail --hard-fail-on HIGH,CRITICAL \
          --output cli --output junitxml --output-file-path console,checkov-report
      else
        checkov --config-file .checkov.yml \
          --output cli --output junitxml --output-file-path console,checkov-report
      fi
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: checkov-report/results_junitxml.xml

# ------------------------------------------------------------------ plan ----

terraform_plan:
  extends:
    - .terraform_base
    - .aws_auth
  stage: plan
  resource_group: terraform-${TF_VAR_environment}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    access: developer
    expire_in: 1 week
    paths:
      - terraform/tfplan
      - terraform/plan.txt
      - terraform/build/

# ----------------------------------------------------------------- apply ----

terraform_apply:
  extends:
    - .terraform_base
    - .aws_auth
  stage: apply
  resource_group: terraform-${TF_VAR_environment}
  needs:
    - job: terraform_plan
      artifacts: true
  environment:
    name: $TF_VAR_environment
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - terraform apply -auto-approve tfplan
    - terraform output
